name: Deploy

# Publishing a GitHub release deploys its tag to Cloudflare Workers.
# Run it by hand to redeploy a branch or tag.
#
# Repository settings:
#   secret   CLOUDFLARE_API_TOKEN   Workers Editor on this Worker + Workers Routes Write on the domain's zone
#   variable CLOUDFLARE_ACCOUNT_ID
#   variable CUSTOM_DOMAIN          e.g. stock.example.com; unset deploys to workers.dev only
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer release waits instead of cancelling an upload midway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build
        run: |
          [ -n "$CUSTOM_DOMAIN" ] || echo "::warning::CUSTOM_DOMAIN is not set; this deploy turns workers.dev back on."
          pnpm build
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      # The token is only exposed to this step, not to dependency install scripts.
      - name: Deploy
        run: pnpm exec wrangler deploy --tag "$TAG" --message "$TAG ($(git rev-parse --short HEAD))"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
